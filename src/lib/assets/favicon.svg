<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<title>higgsphere</title>
	<defs>
		<radialGradient id="sphere" cx="34%" cy="28%" r="78%">
			<stop offset="0%" stop-color="#cdbfff"/>
			<stop offset="42%" stop-color="#8b6cff"/>
			<stop offset="100%" stop-color="#4a2ed2"/>
		</radialGradient>
		<radialGradient id="halo" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#8b6cff" stop-opacity=".35"/>
			<stop offset="100%" stop-color="#8b6cff" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<!-- Fond sombre : l'onglet peut être clair comme sombre, la pastille tranche des deux côtés. -->
	<rect width="64" height="64" rx="15" fill="#0e0e13"/>
	<circle cx="32" cy="32" r="26" fill="url(#halo)"/>

	<!-- Même tracé que Logo.svelte, mis à l'échelle depuis sa grille de 32. -->
	<g transform="translate(32 32) scale(1.72) translate(-16 -16)">
		<ellipse cx="16" cy="16" rx="14.2" ry="5.4" transform="rotate(-25 16 16)"
			fill="none" stroke="#3ddbb4" stroke-width="2"/>
		<circle cx="16" cy="16" r="8" fill="url(#sphere)"/>
		<path d="M28.87 10 A14.2 5.4 -25 0 1 18.28 20.89 A14.2 5.4 -25 0 1 3.13 22"
			fill="none" stroke="#3ddbb4" stroke-width="2" stroke-linecap="round"/>
	</g>
</svg>
